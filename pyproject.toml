[project]
name = "reservingt"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Niekrenz82", email = "cuniekrenz@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "marimo>=0.25.1",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "streamlit>=1.66.0",
]

[project.scripts]
reservingt = "reservingt:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
